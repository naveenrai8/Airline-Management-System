spring:
  application:
    name: ams

  mvc:
    problemdetails:
      enabled: true    # RFC 7807 application/problem+json for @ExceptionHandler ProblemDetail returns
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/flightdb}
    username: ${SPRING_DATASOURCE_USERNAME:learner}
    password: ${SPRING_DATASOURCE_PASSWORD:learner_pass}
  jpa:
    hibernate:
      # ddl-auto: validate was tried first (Flyway owns the schema; Hibernate should only
      # validate entities match), but startup fails: Postgres airport.id/route FK columns are
      # CHAR(4) (bpchar), while Hibernate maps a plain String @Id to varchar and rejects the
      # bpchar/varchar mismatch during schema validation (SchemaManagementException: "wrong
      # column type encountered in column [id] in table [airport]; found [bpchar
      # (Types#CHAR)], but expecting [varchar(255) (Types#VARCHAR)]"). Flyway already owns and
      # applied the schema, so validation adds no safety here — falling back to none.
      ddl-auto: none
    open-in-view: false    # disable OSIV (production anti-pattern)
  data:
    redis:
      # Defaults are for laptop runs (published Compose port). Inside a container these are
      # overridden by SPRING_DATA_REDIS_* env vars to the service name + internal port.
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:55103}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis123}   # matches --requirepass in docker-compose
server:
  port: 58100
management:
  endpoints:
    web:
      exposure:
        include: health          # /actuator/health only
  endpoint:
    health:
      show-details: always       # show the per-component (redis, db) status
